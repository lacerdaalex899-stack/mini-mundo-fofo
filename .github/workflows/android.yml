name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar projeto (copia o jogo para dentro do app)
        run: |
          npm ci
          npx cap sync android
          ls android/app/src/main/assets/public/js | head

      - name: Conferir o SDK do Android que já vem no runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Compilar APK (debug, instalável)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar arquivo
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk "saida/mini-mundo-fofo.apk"
          ls -la saida

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-mundo-fofo-apk
          path: saida/mini-mundo-fofo.apk
          retention-days: 30

      - name: Enviar APK para a branch "apk" (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp saida/mini-mundo-fofo.apk /tmp/
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cd /tmp/pub
          git init -q -b apk
          cp /tmp/mini-mundo-fofo.apk .
          echo "# APK pronto" > README.md
          echo "" >> README.md
          echo "Baixe **mini-mundo-fofo.apk** aqui nesta branch. Compilado automaticamente." >> README.md
          git add .
          git commit -q -m "APK $(date -u '+%Y-%m-%d %H:%M') UTC"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin apk
